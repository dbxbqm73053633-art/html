<!<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMBAK</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .logo-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-svg {
      width: 150px;
      height: auto;
      margin-bottom: 16px;
    }

    .logo-text {
      font-size: 32px;
      letter-spacing: 0.24em;
      font-weight: 600;
      color: #5b7db1;
      text-align: center;
    }

    @media (min-width: 480px) {
      .logo-wrapper {
        padding: 60px 20px;
      }

      .logo-text {
        font-size: 36px;
      }

      .logo-svg {
        width: 170px;
      }
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <!-- Logo -->
    <svg
      class="logo-svg"
      viewBox="0 0 200 140"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- Outer tent border -->
      <polygon
        points="100,10 40,120 160,120"
        fill="#5b7db1"
        stroke="#ffffff"
        stroke-width="3"
      />

      <!-- Inner white triangle (tent entrance) -->
      <polygon
        points="100,35 80,90 120,90"
        fill="#ffffff"
      />

      <!-- Bottom small white rectangles on both sides -->
      <rect x="44" y="114" width="8" height="10" fill="#ffffff" />
      <rect x="148" y="114" width="8" height="10" fill="#ffffff" />

      <!-- Tent poles on top forming an X -->
      <line
        x1="92"
        y1="0"
        x2="100"
        y2="14"
        stroke="#5b7db1"
        stroke-width="3"
        stroke-linecap="round"
      />
      <line
        x1="108"
        y1="0"
        x2="100"
        y2="14"
        stroke="#5b7db1"
        stroke-width="3"
        stroke-linecap="round"
      />
    </svg>

    <!-- Text -->
    <div class="logo-text">CAMBAK</div>
  </div>
</body>
</html>
