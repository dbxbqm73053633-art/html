<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>제주 환상 자전거길 - 코스</title>

  <!-- 메인 스타일 -->
  <link rel="stylesheet" href="./css/cos.css" />

  <!-- 카카오 지도 SDK (코스 길 표시용) -->
  <!-- api키와 도메인은 질문에서 준 값으로 사용 -->
  <script 
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services">
  </script>
</head>
<body>
  <div class="app">
    <!-- 상단 헤더 -->
    <header class="course-hero">
      <div class="course-hero-top">
        <div>
          <p class="hero-eyebrow">JEJU FANTASY BIKE</p>
          <h1 class="hero-title">제주 환상 자전거길 5코스</h1>
          <p class="hero-sub">
            해안·오름·도시를 잇는 234km 중, 라이더들이 많이 찾는 대표 구간만 골라 담았어.
          </p>
        </div>

        <div class="hero-badge">
          <span class="badge-label">선택 가능한 코스</span>
          <span class="badge-value"><span id="courseCount">0</span>개</span>
        </div>
      </div>

      <section class="course-summary">
        <div class="summary-main">
          <div>
            <span class="summary-label">오늘 라이딩 계획 세우기</span>
            <span class="summary-title">지도로 먼저 코스를 확인해봐</span>
          </div>
          <div class="summary-pills">
            <span class="pill small">해안 라이딩</span>
            <span class="pill small">오름 뷰</span>
            <span class="pill small">카페 스팟</span>
          </div>
        </div>
        <div class="summary-metrics">
          <div class="metric">
            <span class="metric-label">평균 거리</span>
            <span class="metric-value" id="avgDistance">0km</span>
          </div>
          <div class="metric">
            <span class="metric-label">난이도</span>
            <span class="metric-value" id="avgLevel">-</span>
          </div>
        </div>
      </section>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="content">
      <!-- 지도 영역 -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">코스 지도</h2>
          <p class="section-sub">
            아래에서 코스를 선택하면 카카오맵 위에 자세한 이동 경로가 그려져.
          </p>
        </div>
        <div id="map" class="map-container"></div>

        <div class="selected-course-info">
          <h3 id="selectedCourseName">코스를 선택해 주세요</h3>
          <p id="selectedCourseMeta">지도 위에서 원하는 코스를 선택하면 상세 정보가 표시됩니다.</p>
        </div>
      </section>

      <!-- 필터 & 코스 리스트 -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">제주 대표 5코스</h2>
        </div>

        <div class="filter-row">
          <button class="chip chip-active" data-filter="all">전체</button>
          <button class="chip" data-filter="easy">초급</button>
          <button class="chip" data-filter="mid">중급</button>
          <button class="chip" data-filter="hard">상급</button>
        </div>

        <div id="courseList" class="course-list">
          <!-- 자바스크립트로 렌더링 -->
        </div>
      </section>

      <div class="spacer"></div>
    </main>

    <!-- 하단 탭바 (camp.html 프레임과 동일 구조) -->
    <nav class="tabbar" aria-label="하단 탭">
      <button class="tab" data-tab="home" type="button" aria-label="홈" onclick="goPage('main.html')">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true">
          <path d="M12 3 3 10v11h6v-6h6v6h6V10l-9-7Z"/>
        </svg>
        <span>홈</span>
      </button>

      <button class="tab" data-tab="community" type="button" aria-label="커뮤니티" onclick="goPage('community.html')">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true">
          <path d="M7 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm10 2a4 4 0 1 0-3.4-6.1A6.9 6.9 0 0 1 14 11c0 .7-.1 1.4-.3 2H17ZM2 21c0-4 3-7 7-7s7 3 7 7H2Zm14.5 0c-.1-1.7-.7-3.2-1.6-4.4.7-.4 1.6-.6 2.6-.6 2.8 0 5 2 5 5h-6Z"/>
        </svg>
        <span>커뮤니티</span>
      </button>

      <button class="tab active" data-tab="course" type="button" aria-label="코스">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true">
          <path d="M7 17a3 3 0 1 1 2.8-4h4.5l-1.6-3H10V8h3.8l1.2 2.2h2.5a3 3 0 1 1-.1 2h-1.3l1.7 3.2H9.8A3 3 0 0 1 7 17Zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM7 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
        </svg>
        <span>코스</span>
      </button>

      <button class="tab" data-tab="camping" type="button" aria-label="캠핑" onclick="goPage('camp.html')">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true">
          <path d="M12 3 2 21h20L12 3Zm0 4.1L18.6 19H5.4L12 7.1Zm-3.2 9.4h6.4L12 11l-3.2 5.5Z"/>
        </svg>
        <span>캠핑</span>
      </button>

      <button class="tab" data-tab="my" type="button" aria-label="마이" onclick="goPage('my.html')">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true">
          <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-5 0-9 3-9 7h18c0-4-4-7-9-7Z"/>
        </svg>
        <span>마이</span>
      </button>
    </nav>
  </div>

  <!-- 메인 스크립트 -->
  <script src="./js/cos.js"></script>
</body>
</html>
