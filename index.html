<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보</title>
    <style>
        li{list-style: none; margin-bottom:24px ;}
        input[type="email"],input[type="password"]{
            width: 410px;
            height: 56px;
            font-size: 20px;
            padding-left: 16px;
        }
        label{
            margin-right: 16px;
        }
        .label1{margin: 22px;}
        .label2{margin: 15px;}

    </style>
</head>
<body>
    <form action="">
    <!-- 필드 테두리선 -->
    <fieldset>
        <!-- 폼의 이름 -->
        <legend>개인 정보</legend>
        <ul>
            <li>
                <label for="em" class="label1">이름</label>
                <input type="email" placeholder="아이디 또는 이메일주소" id="em">
            </li>
            <li>
                <label for="pw">메일주소</label>
                <input type="password" placeholder="비밀번호를 입력하세요" id="pw">
            </li>
        </ul>
    </fieldset>
    <!-- 필드 테두리선 -->
    <fieldset>
        <!-- 폼의 이름 -->
        <legend>로그인 정보</legend>
        <ul>
            <li>
                <label for="em" class="label2">아이디</label>
                <input type="email" placeholder="아이디 또는 이메일주소" id="em">
            </li>
            <li>
                <label for="pw">비밀번호</label>
                <input type="password" placeholder="비밀번호를 입력하세요" id="pw">
            </li>
        </ul>
    </fieldset>
    <!-- Data를 데이터베이스 서버에 전송 -->
    <input type="submit" value="로그인">
    <!-- 사용자로부터 입력한 Data를 취소(초기화) -->
    <input type="reset" value="취소">
   </form>
   
</body>
</html>
