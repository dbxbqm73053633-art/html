<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체data</title>
</head>
<body>
    <!-- 하나의 객체에 여러개를 저장할때 -->
     <!-- 1인 -> 홍길동 이름,성별,주소,전화번호.. -->

     <script>
        // 객체를 선언하는 방법
        // {}
        // 객체에 접근해서 data를 출력하는 방법
        // 객체변수명. indexkey값
        // 객체는 indexkey값을 개발자가 만든다
        // 서버에 있는 api data하고 통신할때는 json 파일 형식으로 주고 받는다

        // 배열로 선언
        let score = [100,90,80,70]
        document.write(`영어점수=${score[0]}<br> 국어점수=${score[1]}<br> 수학점수=${score[2]}<br> 컴퓨터점수=${score[3]}<br>`)

        // 객체로 선언
        let jumsu = {
            eng:100,
            kor:90,
            mat:80,
            com:70,
        }
        document.write("<hr>")
        
        // 객체로 data접근 출력
        document.write(`영어점수=${jumsu.eng}<br> 국어점수=${jumsu.kor}<br> 수학점수는=${jumsu.mat}<br> 컴퓨터점수는=${jumsu.com}<br>`)
        
        document.write("<hr>")

        // 책 목록을 출력하는 프로그램(객체) - >소년이 온다
        let book = {
            제목:"소년이 온다",
            저자:"한강",
            가격:13500,
            출간일:"2014년 5월 19일",
            평점:9.8,
            preview:"본 콘텐츠는 (사)한국출판인회의에서 배포하는 ‘KoPub 글꼴’을 사용하고 있습니다 본 전자책은 구동되는 단말기나 소프트웨어, 서체 등에 따라 다르게 보일 수 있습니다.이 책 내용의 전부 또는 일부를 재사용하려면 반드시 저작권자와 창비 양측의 동의를 받아야 합니다."
        }
        document.write(`제목:${book.제목}<br> 가격:${book.가격}<br> 저자:${book.저자}<br> 출간일:${book.출간일}<br> 평점:${book.평점}<br> 미리보기:${book.preview}<br>`)
     
document.write("<hr>")
        // 문제1]
        // 제품이름은 마오,유형은 당절임, 성분은 망고,설탕,치자, 원산지 필리핀 배열에 기억시켜서 출력
        let mm = ["마오","당절","망고","설탕","치자","필리핀"]
        document.write(`제품의 이름은 ${mm[0]}, 유형은 ${mm[1]}임, 성분은 ${mm[2]},${mm[3]},${mm[4]},  원산지는 ${mm[5]} 입니다<br>`)


        // 문제2]
        // 원산지 필리핀 객체변수로 기억시켜서 출력
        let cc = {
            ma:"마오",
            mg:"당절",
            mo:"망고",
            su:"설탕",
            ki:"치자",
            na:"필리핀",    
        }
        document.write(`제품의 이름은 ${cc.ma}, 유형은 ${cc.mg}임, 성분은 ${cc.mo},${cc.su},${cc.ki},  원산지는 ${cc.na} 입니다<br>`)
        </script>



        
</body>
</html>
