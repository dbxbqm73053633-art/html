<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청</title>
    <style>
        li{list-style: none; margin-bottom:24px ;}
    </style>

</head>
<body>
    <form action="">
    <fieldset>
        <legend>신청 과목</legend>
        <ul>
            <li>
                <label for="em" class="label1">이 달에 신청할 과목을 선택하세요 (1과목만 가능)</label>
            </li>
            <li>
                <input type="radio" name="gender" checked id="man"> <label for="man">회화</label>
                    <input type="radio" name="gender" id="woman"> <label for="woman">문법</label>
                    <input type="radio" name="gender" id="woma"> <label for="woma">작문</label>
            </li>
        </ul>
    </fieldset>
   </form action="">
    <fieldset>
        <legend>신청 과목</legend>
        <ul>
            <li>
                <label for="em" class="label1">매일로 받고 싶은 뉴스 주제를 선택해 주세여(복수선책가능)</label>
            </li>
            <li>
                <label for="tour">해외단신</label> <input type="checkbox" checked id="tour">
                <label for="movi">5분 회화</label> <input type="checkbox" checked id="movi">
                <label for="book">모닝팝스</label> <input type="checkbox" checked id="book">
            </li>
        </ul>
    </fieldset>
    <input type="submit" value="선택">
    <input type="reset" value="취소">
   </form>
</body>
</html>
