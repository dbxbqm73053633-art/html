<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>코스 지도 연동 | 네이버 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- ✅ 네이버 지도 JS SDK -->
  <script
    type="text/javascript"
    src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=9b97656fc9c3545b5bc488be86d6e900&submodules=geocoder">
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f172a;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --border: rgba(148, 163, 184, 0.2);
      --text-main: #e5e7eb;
      --text-sub: #9ca3af;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0, #020617 55%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .page {
      width: 100%;
      max-width: 1200px;
      margin: 16px;
      display: flex;
      gap: 16px;
    }

    /* 좌측: 코스 리스트 영역 */
    .sidebar {
      width: 360px;
      min-width: 320px;
      background: linear-gradient(135deg, #020617, #020617 50%, #1e293b 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.9);
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.25);
      font-size: 11px;
      color: #a7f3d0;
      width: fit-content;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-sub);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .filter-tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .filter-tag span.dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }

    .filter-tag[data-level="easy"] span.dot { background: #4ade80; }
    .filter-tag[data-level="normal"] span.dot { background: #facc15; }
    .filter-tag[data-level="hard"] span.dot { background: #fb7185; }

    .filter-tag.active {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.8);
      color: #e0f2fe;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .list-header span.highlight {
      color: var(--accent);
      font-weight: 500;
    }

    .course-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .course-card {
      position: relative;
      padding: 10px 11px;
      border-radius: var(--radius-md);
      background: radial-gradient(circle at top left, #020617 0, #020617 48%, #020617 100%);
      border: 1px solid rgba(51, 65, 85, 0.9);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .course-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: radial-gradient(circle at top, rgba(59, 130, 246, 0.3), transparent 60%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .course-card:hover::before {
      opacity: 1;
    }

    .course-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.9);
      border-color: rgba(148, 163, 184, 0.8);
    }

    .course-card.active {
      background: linear-gradient(135deg, #020617, #0f172a);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.3),
                  0 18px 45px rgba(6, 182, 212, 0.25);
    }

    .course-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .course-name {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .course-area {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 1px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .chip {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #cbd5f5;
      background: rgba(15, 23, 42, 0.9);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .chip-level[data-level="easy"] {
      border-color: rgba(74, 222, 128, 0.8);
      color: #bbf7d0;
    }
    .chip-level[data-level="normal"] {
      border-color: rgba(250, 204, 21, 0.8);
      color: #fef9c3;
    }
    .chip-level[data-level="hard"] {
      border-color: rgba(248, 113, 113, 0.9);
      color: #fecaca;
    }

    .course-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .meta-left {
      display: flex;
      gap: 10px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .meta-label {
      color: #64748b;
    }

    .meta-value {
      color: #e5e7eb;
      font-weight: 500;
    }

    .naver-open {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 999px;
      border: 1px dashed rgba(56, 189, 248, 0.8);
      background: rgba(15, 23, 42, 0.95);
      color: #e0f2fe;
    }

    .naver-open span.icon {
      font-size: 13px;
    }

    /* 우측: 지도 영역 */
    .map-panel {
      flex: 1;
      min-height: 420px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, #020617, #020617 60%, #0f172a 100%);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.9);
    }

    .map-header {
      padding: 10px 14px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(51, 65, 85, 0.9);
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 60%);
    }

    .map-header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .map-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .map-desc {
      font-size: 11px;
      color: var(--text-sub);
    }

    .map-badge {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #e5e7eb;
    }

    .map-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
    }

    #naverMap {
      flex: 1;
      width: 100%;
      min-height: 340px;
    }

    .map-footer {
      padding: 8px 12px 10px;
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(30, 41, 59, 0.9);
      background: rgba(15, 23, 42, 0.96);
    }

    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-color {
      width: 10px;
      height: 2px;
      border-radius: 999px;
    }

    .legend-color.route { background: #38bdf8; }
    .legend-color.marker { background: #f97316; }

    .foot-hint {
      color: #e5e7eb;
    }

    /* 스크롤바 살짝 커스터마이즈 */
    .course-list::-webkit-scrollbar {
      width: 5px;
    }
    .course-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .course-list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 999px;
    }

    /* 반응형 (모바일) */
    @media (max-width: 900px) {
      .page {
        flex-direction: column;
        margin: 10px;
      }
      .sidebar {
        width: 100%;
        min-width: 0;
        order: 2;
      }
      .map-panel {
        order: 1;
        min-height: 320px;
      }
      .map-header {
        padding: 10px 12px 8px;
      }
    }

    @media (max-width: 480px) {
      .title {
        font-size: 18px;
      }
      .course-card {
        padding: 9px 9px;
      }
      .course-name {
        font-size: 13px;
      }
      #naverMap {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 좌측: 코스 리스트 -->
    <aside class="sidebar">
      <div class="header">
        <div class="badge">
          <span class="badge-dot"></span>
          실제 네이버 지도 연동 코스 5선
        </div>
        <div class="title-row">
          <h1 class="title">라이딩 / 트레킹 코스</h1>
        </div>
        <p class="subtitle">원하는 코스를 클릭하면 오른쪽 네이버 지도에 라인이 그려지고, 새 탭에서 네이버 지도 웹이 열립니다.</p>
      </div>

      <div class="filter-bar">
        <button class="filter-tag active" data-level="all">
          전체
        </button>
        <button class="filter-tag" data-level="easy">
          <span class="dot"></span> 쉬움
        </button>
        <button class="filter-tag" data-level="normal">
          <span class="dot"></span> 보통
        </button>
        <button class="filter-tag" data-level="hard">
          <span class="dot"></span> 어려움
        </button>
      </div>

      <div class="list-header">
        <span><span class="highlight" id="courseCount">5</span>개 코스</span>
        <span>서울 · 경기 · 인천 · 부산</span>
      </div>

      <div class="course-list" id="courseList">
        <!-- JS로 코스 카드 생성 -->
      </div>
    </aside>

    <!-- 우측: 네이버 지도 패널 -->
    <section class="map-panel">
      <div class="map-header">
        <div class="map-header-left">
          <div class="map-title">네이버 지도 실시간 연동</div>
          <div class="map-desc">코스를 선택하면 지도 중심이 이동하고, 출발–도착 구간이 라인으로 표시됩니다.</div>
        </div>
        <div class="map-badge">
          <span class="map-badge-dot"></span>
          Naver Maps JavaScript SDK
        </div>
      </div>
      <div id="naverMap"></div>
      <div class="map-footer">
        <div class="legend">
          <div class="legend-item">
            <span class="legend-color route"></span><span>코스 라인</span>
          </div>
          <div class="legend-item">
            <span class="legend-color marker"></span><span>출발 지점</span>
          </div>
        </div>
        <div class="foot-hint">
          코스 클릭 시 map.naver.com 이 새 탭으로 열립니다.
        </div>
      </div>
    </section>
  </div>

  <script>
    // 예시 코스 5개 (좌표는 샘플 값)
    const courses = [
      {
        id: 1,
        name: "한강 리버사이드 라이딩",
        area: "서울 · 여의도 ↔ 반포",
        level: "easy",
        distance: "12km",
        time: "1시간",
        theme: "자전거 / 강변",
        start: { lat: 37.5280, lng: 126.9326 }, // 여의도 근처
        end:   { lat: 37.5124, lng: 126.9981 }  // 반포대교 근처
      },
      {
        id: 2,
        name: "북한산 초입 트레킹 코스",
        area: "서울 · 북한산성입구",
        level: "normal",
        distance: "6km",
        time: "2시간",
        theme: "등산 / 숲길",
        start: { lat: 37.6592, lng: 126.9994 },
        end:   { lat: 37.6335, lng: 126.9882 }
      },
      {
        id: 3,
        name: "경춘선 숲길 라이딩",
        area: "경기 · 구리 ↔ 남양주",
        level: "easy",
        distance: "15km",
        time: "1시간 30분",
        theme: "자전거 / 폐선부지",
        start: { lat: 37.6039, lng: 127.1430 },
        end:   { lat: 37.6428, lng: 127.1269 }
      },
      {
        id: 4,
        name: "송도 센트럴파크 데일리 코스",
        area: "인천 · 송도국제도시",
        level: "easy",
        distance: "8km",
        time: "1시간",
        theme: "산책 / 도시뷰",
        start: { lat: 37.3925, lng: 126.6434 },
        end:   { lat: 37.3872, lng: 126.6560 }
      },
      {
        id: 5,
        name: "광안리 해변 러닝 코스",
        area: "부산 · 광안리해수욕장",
        level: "normal",
        distance: "7km",
        time: "50분",
        theme: "러닝 / 해안",
        start: { lat: 35.1530, lng: 129.1186 },
        end:   { lat: 35.1554, lng: 129.1302 }
      }
    ];

    let map = null;
    let activePolyline = null;
    let activeCourseId = null;

    function strokeColorByLevel(level) {
      if (level === "easy") return "#4ade80";
      if (level === "normal") return "#facc15";
      if (level === "hard") return "#fb7185";
      return "#38bdf8";
    }

    // ✅ 네이버 지도 웹(map.naver.com) 새 탭으로 열기
    function openInNaverWebMap(course) {
      if (!course || !course.start) return;

      const lat = course.start.lat;
      const lng = course.start.lng;
      const title = encodeURIComponent(course.name);

      // 웹 지도 URL (위도/경도 + 타이틀)
      const url = `https://map.naver.com/?lng=${lng}&lat=${lat}&title=${title}`;
      window.open(url, "_blank");
    }

    // 지도에 코스를 포커스하고 라인 표시
    function focusCourseOnMap(course) {
      if (!map || !course || !course.start) return;

      const start = new naver.maps.LatLng(course.start.lat, course.start.lng);
      const end   = course.end
        ? new naver.maps.LatLng(course.end.lat, course.end.lng)
        : null;

      // 이전 라인 제거
      if (activePolyline) {
        activePolyline.setMap(null);
        activePolyline = null;
      }

      // 새 라인
      if (end) {
        activePolyline = new naver.maps.Polyline({
          map,
          path: [start, end],
          strokeWeight: 5,
          strokeColor: strokeColorByLevel(course.level),
          strokeOpacity: 0.95
        });

        const bounds = new naver.maps.LatLngBounds(start, end);
        map.fitBounds(bounds, { top: 40, right: 40, bottom: 36, left: 40 });
      } else {
        map.setCenter(start);
        map.setZoom(13);
      }
    }

    // 좌측 리스트 렌더링
    function renderCourseList(filterLevel = "all") {
      const listEl = document.getElementById("courseList");
      listEl.innerHTML = "";

      const filtered = courses.filter(c =>
        filterLevel === "all" ? true : c.level === filterLevel
      );

      document.getElementById("courseCount").textContent = filtered.length;

      filtered.forEach(course => {
        const card = document.createElement("article");
        card.className = "course-card";
        card.dataset.id = course.id;

        if (course.id === activeCourseId) {
          card.classList.add("active");
        }

        card.innerHTML = `
          <div class="course-top">
            <div>
              <div class="course-name">${course.name}</div>
              <div class="course-area">${course.area}</div>
            </div>
            <div class="naver-open">
              <span class="icon">🗺️</span>
              <span>네이버 지도</span>
            </div>
          </div>
          <div class="chip-row">
            <span class="chip chip-level" data-level="${course.level}">
              난이도 · ${course.level === "easy" ? "쉬움" : course.level === "normal" ? "보통" : "어려움"}
            </span>
            <span class="chip">${course.theme}</span>
          </div>
          <div class="course-meta">
            <div class="meta-left">
              <div class="meta-pill">
                <span class="meta-label">거리</span>
                <span class="meta-value">${course.distance}</span>
              </div>
              <div class="meta-pill">
                <span class="meta-label">예상시간</span>
                <span class="meta-value">${course.time}</span>
              </div>
            </div>
            <div class="meta-pill">
              <span class="meta-label">코스 ID</span>
              <span class="meta-value">#${course.id}</span>
            </div>
          </div>
        `;

        // 카드 전체 클릭: 지도 포커스 + 네이버 지도 웹
        card.addEventListener("click", () => {
          activeCourseId = course.id;
          updateActiveCard();
          focusCourseOnMap(course);
          openInNaverWebMap(course);
        });

        listEl.appendChild(card);
      });
    }

    function updateActiveCard() {
      const cards = document.querySelectorAll(".course-card");
      cards.forEach(card => {
        const id = Number(card.dataset.id);
        if (id === activeCourseId) {
          card.classList.add("active");
        } else {
          card.classList.remove("active");
        }
      });
    }

    // 필터 버튼 이벤트
    function initFilterBar() {
      const filterButtons = document.querySelectorAll(".filter-tag");
      filterButtons.forEach(btn => {
        btn.addEventListener("click", (e) => {
          const level = btn.dataset.level;
          filterButtons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          renderCourseList(level);

          // 필터 변경 시, 첫 번째 코스를 자동 선택해도 되고,
          // 그대로 둘 수도 있음. 여기서는 그대로 둔다.
        });
      });
    }

    // 지도 초기화
    function initMap() {
      const center = new naver.maps.LatLng(37.5665, 126.9780); // 서울 시청 근방

      map = new naver.maps.Map("naverMap", {
        center,
        zoom: 10,
        minZoom: 6,
        maxZoom: 18,
        zoomControl: true,
        zoomControlOptions: {
          position: naver.maps.Position.RIGHT_BOTTOM
        },
        mapDataControl: false,
        scaleControl: false,
        logoControlOptions: {
          position: naver.maps.Position.LEFT_BOTTOM
        }
      });

      // 출발 지점 마커
      courses.forEach(course => {
        if (!course.start) return;
        const marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(course.start.lat, course.start.lng),
          map,
          title: course.name,
          icon: {
            content: `
              <div style="
                background:#020617;
                border:1px solid rgba(248,113,113,0.9);
                padding:4px 7px;
                border-radius:999px;
                font-size:11px;
                color:#fecaca;
                white-space:nowrap;
                box-shadow:0 6px 16px rgba(15,23,42,0.9);
              ">
                ● 출발
              </div>`
          }
        });

        naver.maps.Event.addListener(marker, "click", () => {
          activeCourseId = course.id;
          updateActiveCard();
          focusCourseOnMap(course);
          openInNaverWebMap(course);
        });
      });

      // 첫 코스 자동 선택
      if (courses.length > 0) {
        activeCourseId = courses[0].id;
        updateActiveCard();
        focusCourseOnMap(courses[0]);
      }
    }

    // JS SDK 로딩 후 콜백
    if (window.naver && window.naver.maps) {
      naver.maps.onJSContentLoaded = function () {
        initMap();
      };
    } else {
      window.addEventListener("load", initMap);
    }

    // 초기 렌더링
    document.addEventListener("DOMContentLoaded", () => {
      renderCourseList("all");
      initFilterBar();
    });
  </script>
</body>
</html>
