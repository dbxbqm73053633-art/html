<!-- index.html: 넷플릭스 스타일 반응형 + TMDB (지금 상영 / 최신 / 평점 높은 / 랜덤 추천) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Netflix - TMDB Movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-main: #141414;
      --bg-elevated: #181818;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --accent: #e50914;
      --radius: 4px;
    }

    body {
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* 헤더 */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 0 4vw;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.9),
        rgba(0, 0, 0, 0.4),
        transparent
      );
      z-index: 20;
    }

    .header__left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-weight: 800;
      font-size: 24px;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav__item {
      font-size: 14px;
      text-decoration: none;
      color: var(--text-sub);
      transition: color 0.2s;
    }

    .nav__item:hover,
    .nav__item--active {
      color: var(--text-main);
    }

    .header__right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      border: none;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-main);
    }

    .profile__avatar {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }

    /* 메인 전체 레이아웃 */
    .main {
      padding-top: 60px;
    }

    /* 히어로 영역 */
    .hero {
      position: relative;
      height: 60vh;
      min-height: 380px;
      color: #fff;
      display: flex;
      align-items: flex-end;
      padding: 0 4vw 60px;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(
          circle at 20% 20%,
          rgba(0, 0, 0, 0.4),
          transparent 50%
        ),
        linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent 60%);
      z-index: 1;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      max-width: 560px;
    }

    .hero__title {
      font-size: clamp(26px, 4vw, 44px);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .hero__meta {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    .hero__overview {
      font-size: 14px;
      line-height: 1.5;
      max-height: 4.2em;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 18px;
    }

    .hero__buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background-color 0.15s ease,
        color 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.03);
    }

    .btn--primary {
      background: #fff;
      color: #000;
    }

    .btn--secondary {
      background: rgba(109, 109, 110, 0.7);
      color: #fff;
    }

    .hero__fade-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background-image: linear-gradient(
        to bottom,
        transparent,
        rgba(20, 20, 20, 0.95)
      );
      z-index: 1;
    }

    /* 영화 리스트 영역 */
    .rows {
      padding: 0 4vw 40px;
      margin-top: -40px;
    }

    .row {
      margin-bottom: 26px;
    }

    .row__title {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .row__subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .row__scroller-wrapper {
      position: relative;
    }

    .row__posters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 8px;
      scroll-behavior: smooth;
    }

    .row__posters::-webkit-scrollbar {
      height: 6px;
    }
    .row__posters::-webkit-scrollbar-track {
      background: transparent;
    }
    .row__posters::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 999px;
    }

    .row__scroll-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, 0.4);
      width: 32px;
      height: 80px;
      cursor: pointer;
      color: #fff;
      font-size: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .row__scroll-btn--left {
      left: -8px;
    }

    .row__scroll-btn--right {
      right: -8px;
    }

    .row__scroll-btn:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .card {
      position: relative;
      flex: 0 0 auto;
      width: 140px;
      max-width: 42vw;
      cursor: pointer;
    }

    .card__image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 4px;
      overflow: hidden;
      background: #222;
    }

    .card__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .card:hover .card__image {
      transform: scale(1.08);
    }

    .card__rating {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
    }

    .card__title {
      font-size: 13px;
      margin-top: 4px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      padding: 10px 4vw 20px;
      font-size: 13px;
      color: var(--text-sub);
    }

    @media (min-width: 768px) {
      .hero {
        height: 70vh;
      }

      .row__posters {
        padding-bottom: 14px;
      }

      .row__scroll-btn {
        display: flex;
      }
    }

    @media (max-width: 768px) {
      .header {
        padding: 0 3vw;
      }

      .nav {
        display: none;
      }

      .rows {
        padding: 0 3vw 32px;
      }

      .card {
        width: 120px;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding: 0 3vw 40px;
      }

      .hero__overview {
        font-size: 13px;
      }

      .row__title {
        font-size: 16px;
      }

      .card {
        width: 110px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__left">
      <div class="logo">NETFLIX</div>
      <nav class="nav">
        <a href="#" class="nav__item nav__item--active">홈</a>
        <a href="#" class="nav__item">시리즈</a>
        <a href="#" class="nav__item">영화</a>
        <a href="#" class="nav__item">New & 인기 콘텐츠</a>
        <a href="#" class="nav__item">내가 찜한 리스트</a>
      </nav>
    </div>
    <div class="header__right">
      <button class="icon-btn" aria-label="검색">🔍</button>
      <button class="icon-btn" aria-label="알림">🔔</button>
      <div class="profile">
        <div class="profile__avatar">W</div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="hero" id="hero">
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">로딩 중...</h1>
        <p class="hero__meta" id="hero-meta"></p>
        <p class="hero__overview" id="hero-overview"></p>
        <div class="hero__buttons">
          <button class="btn btn--primary">▶ 재생</button>
          <button class="btn btn--secondary">ℹ️ 상세 정보</button>
        </div>
      </div>
      <div class="hero__fade-bottom"></div>
    </section>

    <section class="rows">
      <div class="row">
        <h2 class="row__title">지금 상영 중인 영화</h2>
        <div class="row__scroller-wrapper">
          <button class="row__scroll-btn row__scroll-btn--left" data-target="now-playing-row">◀</button>
          <div class="row__posters" id="now-playing-row"></div>
          <button class="row__scroll-btn row__scroll-btn--right" data-target="now-playing-row">▶</button>
        </div>
      </div>

      <div class="row">
        <h2 class="row__title">최신 상영작 & 개봉 예정</h2>
        <p class="row__subtitle">가까운 시일 내에 상영되었거나 곧 만날 수 있는 작품들</p>
        <div class="row__scroller-wrapper">
          <button class="row__scroll-btn row__scroll-btn--left" data-target="latest-row">◀</button>
          <div class="row__posters" id="latest-row"></div>
          <button class="row__scroll-btn row__scroll-btn--right" data-target="latest-row">▶</button>
        </div>
      </div>

      <div class="row">
        <h2 class="row__title">평점 높은 영화</h2>
        <p class="row__subtitle">전 세계 이용자들이 인정한 높은 평점의 작품</p>
        <div class="row__scroller-wrapper">
          <button class="row__scroll-btn row__scroll-btn--left" data-target="top-rated-row">◀</button>
          <div class="row__posters" id="top-rated-row"></div>
          <button class="row__scroll-btn row__scroll-btn--right" data-target="top-rated-row">▶</button>
        </div>
      </div>

      <div class="row">
        <h2 class="row__title">랜덤 추천 영화</h2>
        <p class="row__subtitle">오늘은 복권처럼, 랜덤으로 뽑힌 영화 한 편 어떨까요?</p>
        <div class="row__scroller-wrapper">
          <button class="row__scroll-btn row__scroll-btn--left" data-target="random-row">◀</button>
          <div class="row__posters" id="random-row"></div>
          <button class="row__scroll-btn row__scroll-btn--right" data-target="random-row">▶</button>
        </div>
      </div>
    </section>

    <div class="status" id="status"></div>
  </main>

  <script>
    const TMDB_ACCESS_TOKEN =
      "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIwZGE0NzZjMTQyOGY4NzZkMWY2N2MyZWNhYWUyMzE2YSIsIm5iZiI6MTc2NzA3ODQzMS43MDg5OTk5LCJzdWIiOiI2OTUzN2ExZmE5OTMxMTliNmRlNDE5ZWEiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.nZVmFjRrGQPJim1CQoNmv6V8DWYvVLwQCms5O-ec7Hk";

    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const IMAGE_BASE_ORIGINAL = "https://image.tmdb.org/t/p/original";
    const IMAGE_BASE_W500 = "https://image.tmdb.org/t/p/w500";

    const statusEl = document.getElementById("status");
    const heroSection = document.getElementById("hero");
    const heroTitle = document.getElementById("hero-title");
    const heroMeta = document.getElementById("hero-meta");
    const heroOverview = document.getElementById("hero-overview");

    const nowPlayingRow = document.getElementById("now-playing-row");
    const latestRow = document.getElementById("latest-row");
    const topRatedRow = document.getElementById("top-rated-row");
    const randomRow = document.getElementById("random-row");

    function setStatus(message) {
      if (statusEl) {
        statusEl.textContent = message;
      }
    }

    function setupHero(movie) {
      const {
        title,
        name,
        original_title,
        release_date,
        vote_average,
        overview,
        backdrop_path,
        poster_path,
      } = movie;

      const displayTitle = title || name || original_title || "제목 정보 없음";
      heroTitle.textContent = displayTitle;

      const year = release_date ? release_date.slice(0, 4) : "연도 정보 없음";
      const rating = vote_average ? vote_average.toFixed(1) : "평점 없음";
      heroMeta.textContent = `${year} • 평점 ${rating}`;

      heroOverview.textContent =
        overview && overview.trim().length > 0
          ? overview
          : "줄거리 정보가 제공되지 않습니다.";

      const bgPath = backdrop_path || poster_path;
      if (bgPath) {
        heroSection.style.backgroundImage = `url("${IMAGE_BASE_ORIGINAL}${bgPath}")`;
      } else {
        heroSection.style.backgroundColor = "#000";
      }
    }

    function createMovieCard(movie) {
      const { title, name, original_title, poster_path, vote_average } = movie;

      const card = document.createElement("div");
      card.className = "card";

      const imgWrapper = document.createElement("div");
      imgWrapper.className = "card__image-wrapper";

      const img = document.createElement("img");
      img.className = "card__image";

      if (poster_path) {
        img.src = `${IMAGE_BASE_W500}${poster_path}`;
      } else {
        img.src =
          "https://via.placeholder.com/300x450/222222/ffffff?text=No+Image";
      }

      img.alt = title || name || original_title || "영화 포스터";

      const ratingBadge = document.createElement("div");
      ratingBadge.className = "card__rating";
      ratingBadge.textContent = vote_average
        ? `★ ${vote_average.toFixed(1)}`
        : "평점 없음";

      imgWrapper.appendChild(img);
      imgWrapper.appendChild(ratingBadge);

      const titleEl = document.createElement("div");
      titleEl.className = "card__title";
      titleEl.textContent = title || name || original_title || "제목 정보 없음";

      card.appendChild(imgWrapper);
      card.appendChild(titleEl);

      card.addEventListener("click", () => {
        setupHero(movie);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      return card;
    }

    function renderMoviesToRow(movies, rowElement) {
      if (!rowElement) return;
      rowElement.innerHTML = "";
      movies.forEach((movie) => {
        const card = createMovieCard(movie);
        rowElement.appendChild(card);
      });
    }

    async function fetchNowPlaying() {
      try {
        setStatus("지금 상영 중인 영화를 불러오는 중입니다...");

        const res = await fetch(
          `${TMDB_BASE_URL}/movie/now_playing?language=ko-KR&page=1`,
          {
            headers: {
              Authorization: `Bearer ${TMDB_ACCESS_TOKEN}`,
              "Content-Type": "application/json;charset=utf-8",
            },
          }
        );

        if (!res.ok) {
          throw new Error("TMDB now_playing 요청 실패: " + res.status);
        }

        const data = await res.json();
        const results = data.results || [];

        if (!results.length) {
          setStatus("불러올 영화가 없습니다.");
          return;
        }

        setupHero(results[0]);
        renderMoviesToRow(results, nowPlayingRow);
        setStatus(`지금 상영 중인 영화 ${results.length}편을 불러왔습니다.`);
      } catch (err) {
        console.error(err);
        setStatus("데이터를 불러오는 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.");
      }
    }

    async function fetchLatest() {
      try {
        const res = await fetch(
          `${TMDB_BASE_URL}/movie/upcoming?language=ko-KR&region=KR&page=1`,
          {
            headers: {
              Authorization: `Bearer ${TMDB_ACCESS_TOKEN}`,
              "Content-Type": "application/json;charset=utf-8",
            },
          }
        );

        if (!res.ok) {
          throw new Error("TMDB upcoming 요청 실패: " + res.status);
        }

        const data = await res.json();
        const results = data.results || [];
        if (!results.length) return;

        results.sort((a, b) => {
          const da = a.release_date || "9999-12-31";
          const db = b.release_date || "9999-12-31";
          return da.localeCompare(db);
        });

        renderMoviesToRow(results, latestRow);
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchTopRated() {
      try {
        const res = await fetch(
          `${TMDB_BASE_URL}/movie/top_rated?language=ko-KR&page=1`,
          {
            headers: {
              Authorization: `Bearer ${TMDB_ACCESS_TOKEN}`,
              "Content-Type": "application/json;charset=utf-8",
            },
          }
        );

        if (!res.ok) {
          throw new Error("TMDB top_rated 요청 실패: " + res.status);
        }

        const data = await res.json();
        const results = data.results || [];
        if (!results.length) return;

        const sliced = results.slice(0, 20);
        renderMoviesToRow(sliced, topRatedRow);
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchRandomRecommendations() {
      try {
        const randomPage = Math.floor(Math.random() * 5) + 1;

        const res = await fetch(
          `${TMDB_BASE_URL}/movie/popular?language=ko-KR&page=${randomPage}`,
          {
            headers: {
              Authorization: `Bearer ${TMDB_ACCESS_TOKEN}`,
              "Content-Type": "application/json;charset=utf-8",
            },
          }
        );

        if (!res.ok) {
          throw new Error("TMDB popular 요청 실패: " + res.status);
        }

        const data = await res.json();
        let results = data.results || [];
        if (!results.length) return;

        results = results.sort(() => 0.5 - Math.random());
        const picked = results.slice(0, 12);
        renderMoviesToRow(picked, randomRow);
      } catch (err) {
        console.error(err);
      }
    }

    function initRowScrollButtons() {
      const buttons = document.querySelectorAll(".row__scroll-btn");

      buttons.forEach((btn) => {
        const targetId = btn.getAttribute("data-target");
        const target = document.getElementById(targetId);
        if (!target) return;

        btn.addEventListener("click", () => {
          const scrollAmount = target.clientWidth * 0.8;
          if (btn.classList.contains("row__scroll-btn--left")) {
            target.scrollBy({ left: -scrollAmount, behavior: "smooth" });
          } else {
            target.scrollBy({ left: scrollAmount, behavior: "smooth" });
          }
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initRowScrollButtons();
      fetchNowPlaying();
      fetchLatest();
      fetchTopRated();
      fetchRandomRecommendations();
    });
  </script>
</body>
</html>
