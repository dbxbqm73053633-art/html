<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 아파트 실거래 지도</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="app">

    <!-- 상단 헤더 -->
    <header class="global-header">
      <div class="gh-inner">
        <div class="logo">
          <div class="logo-icon">🏢</div>
          <div class="logo-text">
            <div class="logo-title">APT REAL</div>
            <div class="logo-sub">전국 아파트 매매 실거래</div>
          </div>
        </div>

        <div class="gh-controls">
          <label class="gh-label">
            거래월
            <input type="month" id="tradeMonth" />
          </label>
          <button id="btnReload" class="gh-btn">다시 조회</button>
        </div>
      </div>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="layout">

      <!-- 왼쪽: 지역 선택 + 통계 -->
      <aside class="sidebar">
        <!-- 지역 단계 -->
        <section class="sb-section">
          <h2 class="sb-title">지역 선택</h2>

          <div class="sb-step-buttons">
            <button class="sb-step-btn active" data-step="sido">시/도</button>
            <button class="sb-step-btn" data-step="sigungu">시/군/구</button>
            <button class="sb-step-btn" data-step="dong">동</button>
          </div>

          <!-- 시도 목록 -->
          <div class="sb-grid" id="sidoGrid">
            <button class="sb-grid-item" data-sido-ui="서울시">서울시</button>
            <button class="sb-grid-item" data-sido-ui="부산시">부산시</button>
            <button class="sb-grid-item" data-sido-ui="인천시">인천시</button>
            <button class="sb-grid-item" data-sido-ui="대구시">대구시</button>
            <button class="sb-grid-item" data-sido-ui="광주시">광주시</button>
            <button class="sb-grid-item" data-sido-ui="대전시">대전시</button>
            <button class="sb-grid-item" data-sido-ui="울산시">울산시</button>
            <button class="sb-grid-item" data-sido-ui="경기도">경기도</button>
            <button class="sb-grid-item" data-sido-ui="강원도">강원도</button>
            <button class="sb-grid-item" data-sido-ui="충청북도">충청북도</button>
            <button class="sb-grid-item" data-sido-ui="충청남도">충청남도</button>
            <button class="sb-grid-item" data-sido-ui="전라북도">전라북도</button>
            <button class="sb-grid-item" data-sido-ui="전라남도">전라남도</button>
            <button class="sb-grid-item" data-sido-ui="경상북도">경상북도</button>
            <button class="sb-grid-item" data-sido-ui="경상남도">경상남도</button>
            <button class="sb-grid-item" data-sido-ui="세종시">세종시</button>
            <button class="sb-grid-item" data-sido-ui="제주도">제주도</button>
          </div>

          <!-- 시군구 목록 (선택된 시도 기준으로 동적 생성) -->
          <div class="sb-grid hidden" id="sigunguGrid"></div>

          <!-- 동 목록 (선택된 시군구 기준) -->
          <div class="sb-grid hidden" id="dongGrid"></div>

          <div class="sb-selected">
            <div class="sb-selected-label">선택된 지역</div>
            <div id="selectedRegionText" class="sb-selected-text">
              전체 전국 (샘플 보기 중)
            </div>
          </div>
        </section>

        <!-- 통계 요약 -->
        <section class="sb-section">
          <h2 class="sb-title">아파트 실거래 요약</h2>
          <div id="summaryBox" class="summary-box">
            조회된 데이터가 없습니다.  
            왼쪽에서 시/도와 시/군/구를 선택해 주세요.
          </div>
        </section>
      </aside>

      <!-- 오른쪽: 지도 + 동별 리스트 -->
      <section class="main-panel">
        <div class="map-wrapper">
          <div id="map"></div>
        </div>

        <section class="dong-list-section">
          <h2 class="dong-list-title">동별 아파트 실거래 요약</h2>
          <div id="dongList" class="dong-list">
            선택한 시/군/구의 동별 평균 매매가와 거래 횟수가 여기에 표시됩니다.
          </div>
        </section>
      </section>
    </main>
  </div>

  <!-- Kakao Map SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services"></script>
  <script src="./js/index.js"></script>
</body>
</html>
