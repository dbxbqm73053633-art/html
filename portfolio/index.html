<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>펫투어 - 전국 반려동물 동반 여행</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <header class="app-header">
      <div class="app-logo">PetTour</div>
      <div class="app-header-right">
        <button id="nearbyBtn" class="btn btn-outline">내 주변 찾기</button>
      </div>
    </header>

    <!-- 검색 패널 -->
    <section class="search-panel">
      <div class="search-row">
        <div class="field">
          <label for="areaSelect">지역</label>
          <select id="areaSelect">
            <option value="">전국</option>
            <!-- JS로 지역코드 조회 API 결과를 채움 -->
          </select>
        </div>
        <div class="field">
          <label for="categorySelect">분류</label>
          <select id="categorySelect">
            <option value="">전체</option>
            <!-- JS로 서비스 분류코드 조회 API 결과를 채움 -->
          </select>
        </div>
      </div>

      <div class="search-row">
        <div class="field field-flex">
          <label for="keywordInput">키워드</label>
          <div class="field-inline">
            <input id="keywordInput" type="text" placeholder="예: 애견카페, 펜션, 캠핑장" />
            <button id="searchBtn" class="btn btn-primary">검색</button>
          </div>
        </div>
      </div>

      <div class="chip-row">
        <span class="chip chip-active" data-type="all">전체</span>
        <span class="chip" data-type="stay">숙소</span>
        <span class="chip" data-type="cafe">카페</span>
        <span class="chip" data-type="park">공원/산책</span>
        <span class="chip" data-type="etc">기타</span>
      </div>
    </section>

    <!-- 콘텐츠 영역: 리스트 + 지도 -->
    <main class="content">
      <!-- 리스트 패널 -->
      <section class="list-panel">
        <div class="list-header">
          <h2>반려동물 동반 여행지</h2>
          <span id="resultCount" class="result-count">0곳</span>
        </div>

        <div id="listSkeleton" class="list-skeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <div id="placeList" class="place-list">
          <!-- JS에서 카드 렌더링 -->
        </div>
      </section>

      <!-- 지도 패널 -->
      <section class="map-panel">
        <div class="map-header">
          <h2>지도</h2>
          <span id="mapHint">카드를 누르면 지도에서 위치를 바로 볼 수 있어요.</span>
        </div>
        <div id="map" class="map-container"></div>
      </section>
    </main>

    <!-- 상세 모달 (공통정보/소개정보/이미지정보 확장용) -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button id="modalCloseBtn" class="modal-close">×</button>
        <div id="modalBody">
          <!-- JS에서 상세 정보 렌더링 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 카카오맵 SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services"></script>
  <!-- 메인 스크립트 -->
  <script src="./js/index.js"></script>
</body>
</html>
