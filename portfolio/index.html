<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실거래 지도 플랫폼</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="app">

    <!-- 상단 글로벌 헤더 -->
    <header class="global-header">
      <div class="gh-inner">
        <div class="gh-left">
          <div class="logo">
            <div class="logo-icon">🏙</div>
            <div class="logo-text">
              <span class="logo-title">RealMap</span>
              <span class="logo-sub">아파트 매매 실거래</span>
            </div>
          </div>
        </div>
        <nav class="gh-nav">
          <a href="#" class="nav-item active">HOME</a>
          <a href="#" class="nav-item">매물HOME</a>
          <a href="#" class="nav-item">순위분석</a>
          <a href="#" class="nav-item">가격분석</a>
          <a href="#" class="nav-item">인구변화</a>
          <a href="#" class="nav-item">입주물량</a>
          <div class="nav-more">
            <button class="nav-more-btn">분양 ▾</button>
          </div>
        </nav>
        <div class="gh-right">
          <button class="gh-login">로그인</button>
        </div>
      </div>
    </header>

    <!-- 메인 레이아웃 -->
    <div class="layout">

      <!-- 왼쪽 사이드바 -->
      <aside class="sidebar">
        <!-- 상단 탭 (분양 / 아파트·오피스텔) -->
        <div class="sb-top-tabs">
          <button class="sb-tab active">분양</button>
          <button class="sb-tab">아파트/오피스텔</button>
        </div>

        <!-- 검색창 -->
        <div class="sb-search">
          <input
            type="text"
            id="searchComplex"
            placeholder="아파트명을 검색해보세요."
          />
        </div>

        <!-- 지역 + 거래월 선택 -->
        <section class="sb-section">
          <div class="sb-section-header">
            <span class="sb-section-title">지역 선택</span>
          </div>

          <!-- 단계 버튼 -->
          <div class="sb-step-buttons">
            <button class="sb-step-btn active" data-step="sido">시도 선택</button>
            <button class="sb-step-btn" data-step="sigungu">시군구 선택</button>
            <button class="sb-step-btn" data-step="dong">동 선택</button>
          </div>

          <!-- 시도 그리드 -->
          <div class="sb-grid" id="sidoGrid">
            <button class="sb-grid-item" data-sido-ui="서울시">서울시</button>
            <button class="sb-grid-item" data-sido-ui="경기도">경기도</button>
            <button class="sb-grid-item" data-sido-ui="부산시">부산시</button>
            <button class="sb-grid-item" data-sido-ui="대구시">대구시</button>
            <button class="sb-grid-item" data-sido-ui="인천시">인천시</button>
            <button class="sb-grid-item" data-sido-ui="광주시">광주시</button>
            <button class="sb-grid-item" data-sido-ui="대전시">대전시</button>
            <button class="sb-grid-item" data-sido-ui="울산시">울산시</button>
            <button class="sb-grid-item" data-sido-ui="세종시">세종시</button>
            <button class="sb-grid-item" data-sido-ui="강원도">강원도</button>
            <button class="sb-grid-item" data-sido-ui="충청북도">충청북도</button>
            <button class="sb-grid-item" data-sido-ui="충청남도">충청남도</button>
            <button class="sb-grid-item" data-sido-ui="전라북도">전라북도</button>
            <button class="sb-grid-item" data-sido-ui="전라남도">전라남도</button>
            <button class="sb-grid-item" data-sido-ui="경상북도">경상북도</button>
            <button class="sb-grid-item" data-sido-ui="경상남도">경상남도</button>
            <button class="sb-grid-item" data-sido-ui="제주도">제주도</button>
          </div>

          <!-- 시군구 그리드 (동적으로 채움) -->
          <div class="sb-grid hidden" id="sigunguGrid"></div>

          <!-- 동 그리드 (동적으로 채움) -->
          <div class="sb-grid hidden" id="dongGrid"></div>

          <!-- 선택 결과 -->
          <div class="sb-selected">
            <span id="selectedRegionLabel">전국 기준 데이터 (시군구별 평균 매매가)</span>
          </div>

          <!-- 거래월 선택 -->
          <div class="sb-inline-filter">
            <label for="tradeMonth">거래월</label>
            <input type="month" id="tradeMonth" />
          </div>
        </section>

        <!-- 부동산 스터디 아이콘 그리드 (디자인용) -->
        <section class="sb-section">
          <div class="sb-section-header">
            <span class="sb-section-title">부동산 스터디</span>
          </div>
          <div class="sb-study-grid">
            <button class="study-item">
              <div class="study-icon">📉</div>
              <span>최근급락</span>
            </button>
            <button class="study-item">
              <div class="study-icon">💰</div>
              <span>최고가</span>
            </button>
            <button class="study-item">
              <div class="study-icon">📈</div>
              <span>최고상승</span>
            </button>
            <button class="study-item">
              <div class="study-icon">⚔</div>
              <span>거래쟁탈</span>
            </button>
            <button class="study-item">
              <div class="study-icon">🧮</div>
              <span>가격비교</span>
            </button>
            <button class="study-item">
              <div class="study-icon">🏢</div>
              <span>매물공급</span>
            </button>
            <button class="study-item">
              <div class="study-icon">📦</div>
              <span>입주물량</span>
            </button>
            <button class="study-item">
              <div class="study-icon">👥</div>
              <span>인구변화</span>
            </button>
          </div>
        </section>
      </aside>

      <!-- 오른쪽 지도 영역 -->
      <main class="main">

        <!-- 상단 필터 칩 (지표 선택) -->
        <div class="map-top-filters">
          <div class="chip-group">
            <button class="chip active" data-metric="avgPrice">
              시군구별 평균 매매가
            </button>
            <button class="chip" data-metric="count">
              거래 건수
            </button>
          </div>
        </div>

        <!-- 지도 컨테이너 -->
        <div class="map-wrapper">
          <!-- 왼쪽 수직 카테고리 칩 -->
          <div class="map-left-filters">
            <button class="v-chip active">가격</button>
            <button class="v-chip">거래</button>
            <button class="v-chip">비교</button>
          </div>

          <!-- 지도 -->
          <div id="map"></div>

          <!-- 지도 상단 우측 작은 탭 -->
          <div class="map-legend-tabs">
            <button class="legend-tab active" data-level="sido">시도</button>
            <button class="legend-tab" data-level="sigungu">시군구</button>
            <button class="legend-tab" data-level="dong">동</button>
          </div>
        </div>

        <!-- 상세 설명 박스 -->
        <div id="detailInfo" class="map-detail-box">
          왼쪽에서 시도 → 시군구를 선택하면, 선택한 지역의 시군구별 평균 매매가가 지도에 표시됩니다.
        </div>

        <!-- 하단 설명 -->
        <div class="map-footer">
          <span class="map-footer-text">
            공공데이터포털 아파트 매매 실거래가 API를 이용해, 시군구·동별 평균 매매가격과 거래건수를 요약해서 보여주는 데모입니다.
          </span>
        </div>
      </main>
    </div>
  </div>

  <!-- 카카오맵 SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services"></script>
  <script src="./js/index.js"></script>
</body>
</html>
