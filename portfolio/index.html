<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetTour - 전국 반려동물 동반 여행</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더 -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">
          <div class="brand-pet-ears"></div>
          <div class="brand-pet-face">
            <span class="brand-pet-eye left"></span>
            <span class="brand-pet-eye right"></span>
            <span class="brand-pet-nose"></span>
          </div>
        </div>
        <div class="brand-text-block">
          <span class="brand-name">PetTour</span>
          <span class="brand-sub">전국 반려동물 동반 여행지 지도</span>
        </div>
      </div>
      <nav class="top-actions">
        <button id="btnNearby" class="btn btn-ghost">내 주변 찾기</button>
        <button id="btnReset" class="btn btn-outline">조건 초기화</button>
      </nav>
    </header>

    <!-- 상단 펫 히어로 카드 -->
    <section class="hero-strip">
      <div class="hero-text">
        <h1>우리 집 반려동물과 떠나는 여행</h1>
        <p>지역 · 분류 · 키워드만 선택하면, 반려동물 동반 가능한 여행지를 한눈에 볼 수 있어요.</p>
      </div>
      <div class="hero-pets">
        <div class="hero-paw hero-paw-1"></div>
        <div class="hero-paw hero-paw-2"></div>
        <div class="hero-pet-dog">🐶</div>
        <div class="hero-pet-cat">🐱</div>
      </div>
    </section>

    <!-- 검색/필터 바 -->
    <section class="search-bar">
      <!-- 지역 -->
      <div class="filter-group">
        <div class="filter-label-row">
          <span class="filter-label">지역</span>
          <span class="filter-hint">서울 · 수도권 · 전국</span>
        </div>
        <div id="areaButtons" class="filter-chip-row scroll-chips">
          <!-- JS로 버튼 생성 -->
        </div>
      </div>

      <!-- 분류 -->
      <div class="filter-group">
        <div class="filter-label-row">
          <span class="filter-label">분류</span>
          <span class="filter-hint">숙소 / 관광지 / 음식점 등</span>
        </div>
        <div id="categoryButtons" class="filter-chip-row scroll-chips">
          <!-- JS로 버튼 생성 -->
        </div>
      </div>

      <!-- 키워드 -->
      <div class="filter-group">
        <div class="filter-label-row">
          <span class="filter-label">키워드</span>
          <span class="filter-hint">예: 애견카페, 펜션, 캠핑장</span>
        </div>
        <div class="search-row">
          <input
            id="iptKeyword"
            type="text"
            class="keyword-input"
            placeholder="장소 이름 · 특징 · 동네명으로 검색 (서울 20개 기준)"
          />
          <button id="btnSearch" type="button" class="btn btn-primary">
            검색
          </button>
        </div>
      </div>
    </section>

    <!-- 메인 레이아웃 -->
    <main class="main-layout">
      <!-- 리스트 패널 -->
      <section class="panel panel-list">
        <header class="panel-header">
          <div>
            <h2>반려동물 동반 여행지</h2>
            <p class="panel-sub">
              검색 조건에 해당하는 여행지를 리스트와 지도에서 동시에 확인하세요.
            </p>
          </div>
          <div class="panel-meta">
            <span id="txtCount" class="badge-count">0곳</span>
            <span id="txtQueryState" class="query-state">대기 중</span>
          </div>
        </header>

        <div id="listSkeleton" class="list-skeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <div id="listContainer" class="list-container">
          <!-- JS 렌더링 -->
        </div>
      </section>

      <!-- 지도 패널 -->
      <section class="panel panel-map">
        <header class="panel-header panel-header-map">
          <div>
            <h2>지도에서 보기</h2>
            <p class="panel-sub">
              카드를 클릭하면 지도 중심이 이동하고, 클러스터를 확대하면 지역별 여행지를 더 자세히 볼 수 있습니다.
            </p>
          </div>
        </header>
        <div id="map" class="map"></div>
      </section>
    </main>

    <!-- 상세 모달 -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-dialog">
        <button id="btnModalClose" class="modal-close">×</button>
        <div id="modalBody" class="modal-body">
          <!-- JS 내용 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 카카오맵 SDK + 클러스터러 -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services,clusterer"></script>
  <script src="./js/index.js"></script>
</body>
</html>
