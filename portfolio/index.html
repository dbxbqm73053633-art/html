<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실거래가 통합 플랫폼</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="app">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">R</div>
        <div class="brand-text">
          <div class="brand-title">Real Price</div>
          <div class="brand-sub">전국 부동산 실거래가</div>
        </div>
      </div>
      <button class="header-icon" id="btnOpenFilter">
        <span class="material-icon">tune</span>
      </button>
    </header>

    <!-- 검색 필터 영역 -->
    <section class="filter-section" id="filterSection">
      <!-- 거래유형 탭 -->
      <div class="chip-tabs" id="dealTypeTabs">
        <button class="chip-tab active" data-deal-type="aptTrade">아파트 매매</button>
        <button class="chip-tab" data-deal-type="aptRent">아파트 전월세</button>
        <button class="chip-tab" data-deal-type="offiTrade">오피스텔 매매</button>
        <button class="chip-tab" data-deal-type="offiRent">오피스텔 전월세</button>
        <button class="chip-tab" data-deal-type="rhTrade">연립다세대 매매</button>
        <button class="chip-tab" data-deal-type="nrgTrade">상업업무용 매매</button>
        <button class="chip-tab" data-deal-type="induTrade">공장·창고 매매</button>
        <button class="chip-tab" data-deal-type="landTrade">토지 매매</button>
        <button class="chip-tab" data-deal-type="silvTrade">분양권 전매</button>
      </div>

      <!-- 검색 입력폼 -->
      <div class="filter-form">
        <div class="filter-row">
          <label class="filter-label">지역 (법정동)</label>
          <div class="filter-input-group">
            <input
              type="text"
              id="inputDong"
              placeholder="예) 서초구 서초동"
              autocomplete="off"
            />
            <button class="btn-secondary" id="btnCurrentLocation">
              현위치
            </button>
          </div>
          <small class="filter-hint">
            시/군/구 + 동 입력 또는 코드 선택 기능은 추후 확장
          </small>
        </div>

        <div class="filter-row filter-row-inline">
          <div class="filter-col">
            <label class="filter-label">거래월</label>
            <input
              type="month"
              id="inputMonth"
              class="filter-control"
            />
          </div>
          <div class="filter-col">
            <label class="filter-label">정렬</label>
            <select id="selectSort" class="filter-control">
              <option value="recent">최신 실거래 순</option>
              <option value="priceDesc">가격 높은 순</option>
              <option value="priceAsc">가격 낮은 순</option>
              <option value="areaDesc">면적 큰 순</option>
              <option value="areaAsc">면적 작은 순</option>
            </select>
          </div>
        </div>

        <div class="filter-row filter-row-inline">
          <div class="filter-col">
            <label class="filter-label">전용면적 (이상)</label>
            <input
              type="number"
              id="inputMinArea"
              class="filter-control"
              placeholder="m²"
              min="0"
            />
          </div>
          <div class="filter-col">
            <label class="filter-label">금액 (최대)</label>
            <input
              type="number"
              id="inputMaxPrice"
              class="filter-control"
              placeholder="억 단위"
              min="0"
            />
          </div>
        </div>

        <button class="btn-primary w-100" id="btnSearch">
          실거래가 조회
        </button>
      </div>
    </section>

    <!-- 내용 영역: 리스트 + 지도 -->
    <main class="content">
      <!-- 리스트 영역 -->
      <section class="list-section">
        <div class="list-header">
          <div class="list-title">검색 결과</div>
          <div class="list-meta" id="resultMeta">검색 조건을 설정하세요.</div>
        </div>

        <div class="list-container" id="resultList">
          <!-- JS로 결과 카드 추가 -->
        </div>

        <div class="list-footer">
          <button class="btn-outline" id="btnMore" disabled>더 불러오기</button>
        </div>
      </section>

      <!-- 지도 영역 -->
      <section class="map-section">
        <div class="map-header">
          <div class="map-title">지도에서 보기</div>
          <div class="map-meta">매물을 선택하면 위치가 표시됩니다.</div>
        </div>
        <div id="map" class="map-container"></div>
      </section>
    </main>

    <!-- 하단 탭바 -->
    <nav class="bottom-nav">
      <button class="bottom-nav-item active">
        <span class="material-icon">search</span>
        <span>실거래 검색</span>
      </button>
      <button class="bottom-nav-item">
        <span class="material-icon">map</span>
        <span>지도 탐색</span>
      </button>
      <button class="bottom-nav-item">
        <span class="material-icon">bar_chart</span>
        <span>시세 트렌드</span>
      </button>
      <button class="bottom-nav-item">
        <span class="material-icon">person</span>
        <span>마이페이지</span>
      </button>
    </nav>
  </div>

  <!-- Kakao Map SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services"></script>
  <script src="./js/index.js"></script>
</body>
</html>
