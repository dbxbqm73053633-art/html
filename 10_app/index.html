<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>부산 맛집 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="./css/index.css" />
  <!-- 카카오맵 SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900"></script>
</head>
<body>
  <div class="app">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <div class="header-title">
        <span class="logo-dot"></span>
        <h1>부산 맛집</h1>
      </div>
      <div class="header-meta">
        <span id="locationStatus" class="chip chip-soft">
          🔍 내 위치 탐색 중...
        </span>
      </div>
    </header>

    <!-- 지도 영역 -->
    <section class="map-section">
      <div id="map" class="map-box"></div>
      <button id="recenterBtn" class="fab">
        내 위치
      </button>
    </section>

    <!-- 컨트롤 (검색/정렬) -->
    <section class="control-section">
      <div class="control-row">
        <div class="search-wrap">
          <input
            id="keywordInput"
            type="text"
            placeholder="상호명, 메뉴 검색"
            autocomplete="off"
          />
        </div>
        <div class="select-wrap">
          <select id="radiusSelect">
            <option value="0">전체</option>
            <option value="1">1km</option>
            <option value="3">3km</option>
            <option value="5">5km</option>
          </select>
        </div>
      </div>
      <p class="control-hint">
        현 위치 기준 <strong>거리 순</strong>으로 정렬됩니다.
      </p>
    </section>

    <!-- 리스트 -->
    <section class="list-section">
      <ul id="restaurantList" class="restaurant-list">
        <!-- JS에서 동적 렌더링 -->
      </ul>
    </section>

    <!-- 바텀시트 상세 -->
    <section id="bottomSheet" class="bottom-sheet">
      <div class="bottom-sheet-handle"></div>

      <div class="sheet-header">
        <div class="sheet-title-wrap">
          <h2 id="bsTitle" class="sheet-title"></h2>
          <span id="bsDistance" class="chip chip-strong"></span>
        </div>
        <button id="closeSheetBtn" class="sheet-close-btn">✕</button>
      </div>

      <div class="sheet-image-wrap">
        <button class="sheet-like-btn">❤</button>
        <img id="bsImage" src="" alt="맛집 이미지" />
      </div>

      <div class="sheet-body">
        <div class="sheet-row">
          <span class="sheet-label">주소</span>
          <span id="bsAddress" class="sheet-value multiline"></span>
        </div>
        <div class="sheet-row">
          <span class="sheet-label">소개</span>
          <span id="bsDesc" class="sheet-value multiline"></span>
        </div>
        <div class="sheet-row">
          <span class="sheet-label">대표메뉴</span>
          <span id="bsMenu" class="sheet-value multiline"></span>
        </div>
        <div class="sheet-row">
          <span class="sheet-label">문의</span>
          <span id="bsTel" class="sheet-value"></span>
        </div>
        <div class="sheet-row">
          <span class="sheet-label">운영시간</span>
          <span id="bsTime" class="sheet-value multiline"></span>
        </div>

        <div class="sheet-actions">
          <a id="bsCallBtn" href="#" class="btn primary-btn" target="_blank">
            전화걸기
          </a>
          <a id="bsHomepageBtn" href="#" class="btn ghost-btn" target="_blank" rel="noopener noreferrer">
            홈페이지
          </a>
        </div>
      </div>
    </section>

    <!-- 토스트 -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="./js/index.js"></script>
</body>
</html>
