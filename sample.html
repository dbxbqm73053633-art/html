<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진달래꽃</title>
    <STyle>
        H1{text-align: center;}
        H2{text-align: right;}
        P{text-align: center;}
    </STyle>
</head>
<body>
    <h1>진달래 꽃</h1>
    <H2>지은이 : 김소월</H2>
    <P>
        나 보기가 <br>
        역겨워  <br>
        가실 때에는
    </P>
    <P> 
        말 없이 <br>
        고이 <br>
        보내드리오리다
    </P>
    <P>
        영변에 <br>
        약산 <br>
        진달래꽃
    </P>
    <P>
        진달래 <br>
        진달래 꽃 <br>
        피웠네
    </P>
</body>
</html>
