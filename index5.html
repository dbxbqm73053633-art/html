<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if응용3</title>
</head>
<body>
    <script>
        let name = prompt("나이를 입력해 주세요?")
        let res = ''
        if(name>=19){
            res = "성년"
            
        }else{
            res = "미성년자"
        }
        // 출력
        alert("고객님이 입력하신 나이" + name + "는" + res + "입니다")


    </script>
    
</body>
</html>
