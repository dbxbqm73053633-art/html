<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div</title>
    <style>
        *{margin: 0; padding: 0;}
        div{
            width: 510px;
            background: #fea500;
            border: 5px solid #040004;
            padding: 35px 0px 25px;
        }
        h1{margin-bottom: 32px;}
    </style>
</head>
<body>
    <div>
        <h1>애국가</h1>
        <p>동해물과 백두산이 마르고 닮도록 <br>
           하느님이 보우하사 우리나라만세 <br>
           무궁화 삼천리 화려강산 <br>
           대한사람 대하능로 길이 보전하세
           </p>
    </div>
</body>
</html>
