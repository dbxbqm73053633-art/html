<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램</title>
    <style>
        table{
            border: 1px solid #bbbbbb;
            width: 730px;
            margin: auto;
            border-spacing: 0;
            border-collapse: collapse;
            /* 표 윗줄 두께 색깔 */
            border-top: 3px solid #002b5c;
            /* 표 줄 없애기 */
            border-left: none;
            border-right: none;
            height: 200px;
        }
        th{
            border: 1px solid #bbbbbb;
            color: #222;
            background: #f1f1f1;
            height: 51px;
            width: 132.4px;
            border-right: none;
            height: 31px;
        }
        td{
            border: 1px solid #bbbbbb;
            text-align: center;
            color: #555;
            height: 51px;
            border-left: none;
            height: 50px;
        }
        .a{width: 260px; border-left: none;}
        .b{width: 380px;}
        .c{width: 200px;}
        .d{text-align: left;}
        .e{border-right: none;}
    </style>

</head>
<body>
    <table>
        <tr>
            <th class="a">프로그램명</th>
            <th class="b">기능</th>
            <th class="c">수동설치</th>
        </tr>
        <tr>
            <td>암호화 프로그램 <br>
            (AhnLab Safe Transaction)
            </td>
            <td class="d">온라인을 통해 처리되는 모든 정보를 보호하는 <br>
                프로그램 (메모리보호 및 방화벽 기능)
            </td>
            <td class="e"><button>다운로드</button></td>
        </tr>
        <tr>
            <td>키보드 보안 프로그램 <br>
            (KoS)
        </td>
        <td class="d">
            키보드를 통해 입력되는 정보유출(KeyLog)등의 <br>
            해킹툴로 부터 보호하는 프로그램
        </td>
        <td class="e">
            <button>다운로드</button>
        </td>
        <tr>
            <td>
                공동인증프로그램 <br>
                (Sign Korea Certification <br>
                Toolkit)
            </td>
            <td class="d">
                공동인증 로그인과 거래내역에 대한 전자서명을 <br>
                위한 프로그램입니다.
            </td>
            <td class="e">
                <button>다운로드</button>
            </td>
        </tr>
        </tr>
    </table>
</body>
</html>
