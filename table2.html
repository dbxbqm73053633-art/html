<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표</title>
    <style>
        table{
            /* 전체표에 대한 디자인 */
            /* 선의 두께 */
            border-width: 1px ;
            /* 선의 색상 */
            border-color: blue;
            /* 선의 종류(실선) */
            border-style: solid;
            width: 800px;
            /* 글짜에만 사용되는 가운데 정렬 */
            text-align: center;
            /* 표를 가운데 정렬 */
            margin: auto;
            /* 표와 열사이에 갭을(간격) 0으로 처리 */
            border-spacing: 0;
            /* 테두리선 사이 겹침 방지 */
            border-collapse: collapse;
        }
        th{
            /* 열에 대한 디자인 */
            border-color: blue;
            border-style: solid;
            border-width: 1px;
        }
        td{
            border-color: blue;
            border-style: solid;
            border-width: 1px;
        }

    </style>
</head>
<body>
    <table>
        <tr>
            <th>요일</th>
            <th>1교실</th>
            <th>2교실</th>
            <th>3교실</th>
            <th>4교실</th>
            <th>5교실</th>
            <th>6교실</th>
            <th>7교실</th>
        </tr>
        <tr>
            <th>월</th>
            <td>국어</td>
            <td>사회</td>
            <td>과학</td>
            <td>사관</td>
            <td>수학</td>
            <td>영어</td>
            <td>회원</td>
        </tr>
        <tr>
            <th>화</th>
            <td>회원</td>
            <td>커뮤</td>
            <td>영어</td>
            <td>체육</td>
            <td>국어</td>
            <td>사회</td>
            <td>보건</td>
        </tr>
        <tr>
            <th>수</th>
            <td>미술</td>
            <td>과학</td>
            <td>수학</td>
            <td>진로</td>
            <td>커뮤</td>
            <td>창체</td>
            <td>창체</td>
        </tr>
        <tr>
            <th>목</th>
            <td>커뮤</td>
            <td>사관</td>
            <td>미술</td>
            <td>미술</td>
            <td>수학</td>
            <td>과학</td>
            <td>사회</td>
        </tr>
        <tr>
            <th>금</th>
            <td>영어</td>
            <td>국어</td>
            <td>회원</td>
            <td>사관</td>
            <td>체육</td>
            <td>커뮤</td>
        </tr>
    </table>
</body>
</html>
