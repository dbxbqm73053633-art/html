<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온도</title>
</head>
<body>
    <script>
        // 외부로 부터 섭씨(c)온도를 숫자로 입력받아서 화씨(F)온도로 변환해주는
        // 프로그램을 작성 경고창으로 고객님이 입력하신 섭씨 00는 화씨로 00도 입니다

        let Cnum = prompt("섭씨 온도를 숫자로 입력해 주세요?")
        let Fnum = (Cnum * 1.8)+32
        alert("고객님이 입력하신 섭씨 온도" + Cnum + "도 는 화씨로" + Fnum + "도 입니다")


    </script>
</body>
</html>
