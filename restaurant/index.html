<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>내 주변 맛집 랭킹 (Kakao Map)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 헤더 -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">RANK</div>
        <div class="brand-text">
          <h1>내 주변 맛집 랭킹</h1>
          <p>카카오맵 + 사용자 별점/리뷰 기반 실시간 리스트</p>
        </div>
      </div>
      <button class="ghost-btn" id="locateBtn">현재 위치 재설정</button>
    </header>

    <!-- 검색 / 필터 / 정렬 -->
    <section class="search-section">
      <div class="search-bar">
        <input
          type="text"
          id="keywordInput"
          placeholder="지역·가게명·메뉴로 검색 (예: 강남 곱창, 홍대 파스타)"
        />
        <button id="searchBtn">검색</button>
      </div>

      <div class="filter-row">
        <div class="filter-item">
          <label for="categoryFilter">카테고리</label>
          <select id="categoryFilter">
            <option value="all">전체</option>
            <option value="korean">한식</option>
            <option value="japanese">일식</option>
            <option value="chinese">중식</option>
            <option value="western">양식</option>
            <option value="cafe">카페·디저트</option>
            <option value="pub">술집/바</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="distanceFilter">최대 거리</label>
          <select id="distanceFilter">
            <option value="1">1km</option>
            <option value="3" selected>3km</option>
            <option value="5">5km</option>
            <option value="0">제한 없음</option>
          </select>
        </div>
      </div>

      <div class="chip-row">
        <button class="chip chip--active" data-sort="distance">거리순 랭킹</button>
        <button class="chip" data-sort="rating">평점 높은순</button>
        <button class="chip" data-sort="review">리뷰 많은순</button>
        <button class="chip" data-sort="name">가게명 가나다순</button>
      </div>
    </section>

    <!-- 지도 + 랭킹 리스트 -->
    <main class="layout">
      <section class="map-wrapper">
        <div class="panel-header">
          <div>
            <h2 class="section-title">카카오맵</h2>
            <p class="section-caption" id="aroundMeLabel">
              현재 위치 기준 3km 내 맛집(음식점) 탐색 중…
            </p>
          </div>
        </div>
        <div id="map" class="map-panel"></div>
      </section>

      <section class="list-wrapper">
        <h2 class="section-title">맛집 랭킹 리스트</h2>
        <p class="section-caption">
          카카오맵 음식점(FD6) 검색 결과에 앱 내부 별점/리뷰 정보를 붙여 랭킹으로 보여줍니다.
        </p>
        <div id="place-list" class="card-list"></div>
      </section>
    </main>
  </div>

  <!-- Kakao Map JS SDK -->
  <script
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9b97656fc9c3545b5bc488be86d6e900&libraries=services"
  ></script>
  <script src="./js/index.js"></script>
</body>
</html>
