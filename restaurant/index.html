<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공유 기록함</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <!-- 🔒 Password Gate -->
  <div class="lock" id="lock" aria-hidden="false">
    <div class="lock__card" role="dialog" aria-modal="true" aria-label="비밀번호 잠금">
      <div class="lock__badge">🔒</div>
      <h1 class="lock__title">공유 기록함</h1>
      <p class="lock__desc">
        비밀번호를 아는 사람만 들어올 수 있어요.<br/>
        들어오면 사진/메모가 모두 공유 저장됩니다.
      </p>

      <form id="lockForm" class="lock__form">
        <label class="lock__label" for="lockPass">비밀번호</label>
        <div class="lock__row">
          <input id="lockPass" class="lock__input" type="password" inputmode="numeric" maxlength="12"
                 placeholder="비밀번호" autocomplete="off" />
          <button class="btn btn--primary" type="submit">입장</button>
        </div>
        <p class="lock__hint" id="lockHint">비밀번호를 입력해주세요.</p>
      </form>

      <p class="lock__foot">
        * 이 비밀번호는 “입장용 잠금”입니다. (공유 저장은 Firebase 익명 로그인 기반)
      </p>
    </div>
  </div>

  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <span class="brand__name">공유 기록함</span>
        <span class="brand__dot" aria-hidden="true"></span>
      </div>

      <div class="topbar__right">
        <span class="badge" id="connState">연결 안됨</span>
        <button class="btn btn--ghost" id="lockBtn" type="button" title="다시 잠금">잠금</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="grid">
      <!-- MEMO -->
      <article class="card">
        <div class="card__head">
          <h2 class="card__title">메모</h2>
          <p class="card__desc">누가 어디서 저장해도 실시간으로 공유돼요.</p>
        </div>

        <form id="memoForm" class="form">
          <label class="label">
            제목
            <input id="memoTitle" class="input" type="text" maxlength="60" placeholder="예) 오늘의 한 줄" />
          </label>

          <label class="label">
            내용
            <textarea id="memoBody" class="textarea" maxlength="2000" placeholder="내용을 적어주세요"></textarea>
          </label>

          <div class="row">
            <button class="btn btn--primary" type="submit">저장</button>
            <button class="btn btn--ghost" type="button" id="memoRefresh">새로고침</button>
          </div>
        </form>

        <div class="divider"></div>
        <div class="list" id="memoList"></div>
      </article>

      <!-- PHOTOS -->
      <article class="card">
        <div class="card__head">
          <h2 class="card__title">사진</h2>
          <p class="card__desc">사진은 Storage, 정보는 Firestore에 저장돼요.</p>
        </div>

        <div class="form">
          <label class="label">
            앨범
            <input id="photoAlbum" class="input" type="text" maxlength="24" placeholder="예) 여행, 데이트" />
          </label>

          <label class="label">
            캡션
            <input id="photoCaption" class="input" type="text" maxlength="60" placeholder="예) 파리에서" />
          </label>

          <label class="btn btn--primary" for="photoInput">사진 올리기 (여러 장)</label>
          <input id="photoInput" class="sr-only" type="file" accept="image/*" multiple />

          <p class="hint">
            * 여러 장 선택 시 앨범/캡션이 동일하게 적용됩니다.<br/>
            * 업로드 후 목록에 실시간 반영됩니다.
          </p>
        </div>

        <div class="divider"></div>
        <div class="photos" id="photoGrid"></div>
      </article>
    </section>

    <footer class="footer">
      <div class="footer__inner">
        <span>Made with ♡</span>
        <span id="roomLabel">ROOM: shared-room-1</span>
      </div>
    </footer>
  </main>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
