<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 주문서</title>
    <style>
        body{background: #fff;}
        li{list-style:none; margin-bottom: 16px; background: #eeeeee; height: 45px;}
        fieldset{margin-bottom: 16px; border: 2px solid #d3a957;}
        .tel{width: 25px;}
        .tel2{width: 30px;}
        legend{color: #e1b8a2;}
        .aa{background: #000; color: #fff;}
        .bb{background:#fff;}
    </style>
</head>
<body>
    <h1>
        상품 주문서
    </h1>
    <form action="">
        <fieldset>
            <legend>개인정보</legend>
            <ul>
                <li>
                    <label for="id" class="label1">이름:</label>
                    <input type="text" id="id" placeholder="아이디를 입력해 주세요" required autofocus>
                </li>
                <li>
                    <label for="pw">비밀번호:</label>
                    <input type="password" id="pw" placeholder="패스워드를 입력해 주세요" required>
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>배송지 정보</legend>
            <ul>
                <li>
                    <label for="">주소:</label>
                    <input type="text" required>
                </li>
                <li>
                    
                    <label for="">전화번호:</label>
                    <select name="" id="">
                        <option value="">011</option>
                        <option value="">010</option>
                        <option value="">019</option>
                    </select> - 
                    <input type="text" name="" id="" maxlength="4" class="tel2"> - 
                    <input type="text" maxlength="4" class="tel2">
                </li>
                <li>
                    <label for="">메모:
                        <textarea name="" id="" cols="30" rows="2" placeholder="여기에 메모를 입력하세요"></textarea>
                    </label>
                </li>
            </ul>
        </fieldset>
        <fieldset>
        <legend>주문 정보</legend>
        <ul>
            <li>
                <label for="">과테말라 안티구아 (100g):</label>
                <input type="number" min="1" max="10" value="1">개
            </li>
            <li>
                <label for="">인도네시아 만델링 (100g):</label>
                <input type="number" min="1" max="10" value="1">개
            </li>
            <li>
                <label for="">탐라는도다 (블렌딩)(100g):</label>
                <input type="number" min="1" max="10" value="1">개
            </li>
            <li>
                <label for="tour">01</label> <input type="checkbox" checked id="tour">
                <label for="movi">02</label> <input type="checkbox" checked id="movi">
                <label for="book">03</label> <input type="checkbox" checked id="book">
                <label for="book">04</label> <input type="checkbox" checked id="book">
            </li>
            <li>
                <input type="radio"> <label for="">r01</label>
                <input type="radio"> <label for="">r02</label>
                <input type="radio"> <label for="">r03</label>
                <input type="radio" checked id="man"> <label for="">r04</label>
            </li>
        </ul>
        </fieldset>
        <fieldset>
            <legend>버틴 모음</legend>
            <input type="submit" value="주문하기" class="aa">
            <input type="reset" value="취소" class="bb">
        </fieldset>
        
    </form> 
</body>
</html>
